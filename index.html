<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yumix Games</title>
<link rel="icon" type="image/png" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #050505;
  --bg-2: #0a0a0a;
  --text: #f5f5f5;
  --text-dim: rgba(255,255,255,.4);
  --text-dim-2: rgba(255,255,255,.6);
  --card: rgba(255,255,255,.035);
  --card-border: rgba(255,255,255,.08);
  --card-border-hover: rgba(255,255,255,.35);
  --input-bg: rgba(255,255,255,.04);
  --input-border: rgba(255,255,255,.1);
  --input-border-focus: rgba(255,255,255,.4);
  --shadow: rgba(0,0,0,.6);
  --logo-dim: #666;
}
html[data-theme="light"] {
  --bg: #f5f5f5;
  --bg-2: #ffffff;
  --text: #111;
  --text-dim: rgba(0,0,0,.45);
  --text-dim-2: rgba(0,0,0,.65);
  --card: rgba(0,0,0,.03);
  --card-border: rgba(0,0,0,.08);
  --card-border-hover: rgba(0,0,0,.3);
  --input-bg: rgba(0,0,0,.03);
  --input-border: rgba(0,0,0,.1);
  --input-border-focus: rgba(0,0,0,.4);
  --shadow: rgba(0,0,0,.15);
  --logo-dim: #999;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { transition: background .4s ease, color .4s ease; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 32px 20px 80px;
  overflow-x: hidden;
}

#particles {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
}
header, .count, #gameGrid, .theme-toggle {
  position: relative;
  z-index: 1;
}

/* INTRO */
#intro {
  position: fixed;
  inset: 0;
  z-index: 20000;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  gap: 32px;
}
#intro.done {
  opacity: 0;
  visibility: hidden;
  transition: opacity .7s ease, visibility .7s ease;
}
.intro-logo {
  width: clamp(160px, 28vw, 320px);
  height: auto;
  opacity: 0;
  transform: scale(.4) rotate(-180deg);
  animation: logoLand 1.1s cubic-bezier(.2, .9, .25, 1.15) forwards;
  will-change: transform, opacity;
  filter: drop-shadow(0 20px 60px rgba(0,0,0,.5));
}
@keyframes logoLand {
  0% { opacity: 0; transform: scale(.4) rotate(-180deg); }
  60% { opacity: 1; }
  100% { opacity: 1; transform: scale(1) rotate(0deg); }
}
.intro-text {
  font-size: clamp(2rem, 9vw, 6rem);
  font-weight: 900;
  letter-spacing: -0.04em;
  color: var(--text);
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  text-align: center;
  padding: 0 20px;
  line-height: 1;
}
.intro-letter {
  display: inline-block;
  opacity: 0;
  transform: translate(var(--dx, -600px), var(--dy, -400px)) rotate(var(--dr, 60deg)) scale(2.5);
  animation: letterLand .9s cubic-bezier(.2, .9, .25, 1.15) forwards;
  animation-delay: var(--delay, 0s);
  will-change: transform, opacity;
}
.intro-letter.space { width: 0.35em; }
@keyframes letterLand {
  0% { opacity: 0; transform: translate(var(--dx, -600px), var(--dy, -400px)) rotate(var(--dr, 60deg)) scale(2.5); }
  60% { opacity: 1; }
  100% { opacity: 1; transform: translate(0, 0) rotate(0deg) scale(1); }
}
.intro-sub {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--text-dim);
  opacity: 0;
  animation: fadeIn .8s ease forwards;
  animation-delay: 1.4s;
}
@keyframes fadeIn { to { opacity: 1; } }
.intro-skip {
  position: absolute;
  bottom: 24px;
  right: 24px;
  padding: 8px 16px;
  border-radius: 10px;
  border: 1.5px solid var(--input-border);
  background: var(--input-bg);
  color: var(--text-dim-2);
  font-family: inherit;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  opacity: 0;
  animation: fadeIn .6s ease forwards;
  animation-delay: .6s;
}
.intro-skip:hover { color: var(--text); border-color: var(--input-border-focus); }

/* THEME TOGGLE */
.theme-toggle {
  position: fixed;
  top: 24px;
  right: 24px;
  z-index: 9000;
  width: 48px;
  height: 48px;
  border-radius: 12px;
  border: 1.5px solid var(--input-border);
  background: var(--input-bg);
  color: var(--text);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform .2s ease, background .2s ease;
  backdrop-filter: blur(10px);
}
.theme-toggle:hover { transform: translateY(-2px); background: var(--card); }
.theme-toggle svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.theme-toggle .icon-sun { display: none; }
.theme-toggle .icon-moon { display: block; }
html[data-theme="light"] .theme-toggle .icon-sun { display: block; }
html[data-theme="light"] .theme-toggle .icon-moon { display: none; }

/* HEADER */
header {
  max-width: 1200px;
  margin: 0 auto 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  flex-wrap: wrap;
  padding-right: 60px;
}
.header-left {
  display: flex;
  align-items: center;
  gap: 18px;
}
.main-logo {
  width: clamp(60px, 8vw, 90px);
  height: auto;
  filter: drop-shadow(0 8px 24px var(--shadow));
  transition: transform .25s ease;
}
.main-logo:hover { transform: scale(1.08) rotate(-4deg); }
h1 { font-size: clamp(2rem, 5vw, 3rem); font-weight: 900; letter-spacing: -0.05em; color: var(--text); }
h1 span { color: var(--logo-dim); }
.header-right {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.search {
  width: min(360px, 100%);
  height: 48px;
  padding: 0 18px;
  border-radius: 12px;
  border: 1.5px solid var(--input-border);
  background: var(--input-bg);
  color: var(--text);
  font-family: inherit;
  font-size: 14px;
  outline: none;
  transition: border-color .2s ease;
}
.search:focus { border-color: var(--input-border-focus); }
.search::placeholder { color: var(--text-dim); }

/* GN MATH BUTTON */
.gnmath-btn {
  height: 48px;
  padding: 0 20px;
  border-radius: 12px;
  border: 1.5px solid var(--input-border);
  background: var(--input-bg);
  color: var(--text);
  font-family: inherit;
  font-size: 13.5px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: all .25s cubic-bezier(.2,.9,.25,1.4);
}
.gnmath-btn:hover {
  transform: translateY(-3px) scale(1.04);
  border-color: var(--input-border-focus);
  background: var(--card);
  box-shadow: 0 10px 30px var(--shadow);
}
.gnmath-btn:active { transform: translateY(-1px) scale(.98); }
.gnmath-btn svg {
  width: 16px; height: 16px;
  stroke: currentColor; fill: none;
  stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round;
  transition: transform .3s ease;
}
.gnmath-btn:hover svg { transform: translateX(3px); }

/* PAGE SLIDE TRANSITION */
.page-slide {
  position: fixed;
  inset: 0;
  z-index: 30000;
  background: var(--bg);
  transform: translateX(100%);
  transition: transform .55s cubic-bezier(.65, 0, .35, 1);
  pointer-events: none;
  display: flex;
  align-items: center;
  justify-content: center;
}
.page-slide::after {
  content: "";
  width: 48px;
  height: 48px;
  border: 3px solid var(--input-border);
  border-top-color: var(--text);
  border-radius: 50%;
  opacity: 0;
}
.page-slide.active {
  transform: translateX(0);
  pointer-events: auto;
}
.page-slide.active::after {
  opacity: 1;
  animation: spin .9s linear infinite;
  animation-delay: .3s;
}
.page-slide.enter {
  transform: translateX(0);
  transition: none;
}
.page-slide.enter.leaving {
  transform: translateX(-100%);
  transition: transform .55s cubic-bezier(.65, 0, .35, 1);
}

.count {
  max-width: 1200px; margin: 0 auto 20px;
  font-size: 13px; font-weight: 600; color: var(--text-dim);
}
#gameGrid {
  max-width: 1200px; margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 20px;
}
.game-card {
  display: flex; flex-direction: column; padding: 10px;
  border-radius: 16px; background: var(--card);
  border: 1.5px solid var(--card-border);
  text-decoration: none; color: var(--text);
  transition: all .25s ease; cursor: pointer;
}
.game-card:hover {
  border-color: var(--card-border-hover);
  transform: translateY(-6px);
  box-shadow: 0 20px 45px var(--shadow);
}
.game-card img {
  width: 100%; aspect-ratio: 1; object-fit: cover;
  border-radius: 11px; background: var(--bg-2); display: block;
}
.game-card h3 {
  margin: 12px 4px 4px; font-size: 14px; font-weight: 700;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.empty {
  grid-column: 1 / -1; padding: 60px 20px; text-align: center;
  color: var(--text-dim); font-weight: 600;
}

/* GAME IFRAME */
.game-overlay {
  position: fixed; inset: 0; z-index: 9999; background: #000;
  opacity: 0; visibility: hidden;
  transition: opacity .3s ease, visibility .3s ease;
}
.game-overlay.active { opacity: 1; visibility: visible; }
.game-overlay iframe { width: 100%; height: 100%; border: 0; background: #000; }
.overlay-bar {
  position: fixed; top: 16px; left: 50%;
  transform: translateX(-50%) translateY(-80px);
  z-index: 10001; display: flex; align-items: center; gap: 6px; padding: 7px;
  background: rgba(0,0,0,.75); border: 1.5px solid rgba(255,255,255,.12);
  border-radius: 15px; backdrop-filter: blur(16px);
  box-shadow: 0 8px 32px rgba(0,0,0,.6); opacity: 0;
  transition: opacity .3s ease, transform .4s cubic-bezier(.2,.8,.2,1);
}
.overlay-bar.visible { transform: translateX(-50%) translateY(0); opacity: .4; }
.overlay-bar.visible:hover { opacity: 1; transform: translateX(-50%) translateY(-2px); }
.obar-btn {
  display: flex; align-items: center; justify-content: center; gap: 7px;
  height: 38px; padding: 0 14px; border: 1.5px solid transparent;
  border-radius: 10px; background: rgba(255,255,255,.06); color: #fff;
  font-family: inherit; font-size: 12.5px; font-weight: 600;
  cursor: pointer; transition: all .2s ease; white-space: nowrap;
}
.obar-btn:hover { background: rgba(255,255,255,.16); border-color: rgba(255,255,255,.25); }
.obar-btn.close:hover { background: #dc2626; border-color: #dc2626; }
.obar-btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; }
.obar-divider { width: 1px; height: 22px; background: rgba(255,255,255,.15); margin: 0 3px; }
.obar-title { padding: 0 10px; font-size: 13px; font-weight: 700; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #fff; }
.overlay-loading {
  position: fixed; inset: 0; z-index: 10000;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 20px; background: var(--bg);
  transition: opacity .4s ease, visibility .4s ease;
}
.overlay-loading.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
.overlay-loading .spinner {
  width: 44px; height: 44px;
  border: 3px solid var(--input-border); border-top-color: var(--text);
  border-radius: 50%; animation: spin .9s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.overlay-loading p { color: var(--text-dim); font-size: 13px; font-weight: 500; }

@media (max-width: 600px) {
  body { padding: 20px 14px 60px; }
  #gameGrid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .game-card { padding: 7px; border-radius: 12px; }
  .game-card h3 { font-size: 12px; }
  .overlay-bar { top: 10px; gap: 4px; padding: 5px; border-radius: 12px; }
  .obar-btn { height: 34px; padding: 0 10px; font-size: 11.5px; }
  .obar-btn span { display: none; }
  .obar-btn svg { width: 17px; height: 17px; }
  .obar-title, .obar-divider { display: none; }
  .theme-toggle { top: 16px; right: 16px; width: 42px; height: 42px; }
  header { padding-right: 56px; }
  .header-left { gap: 12px; }
  .main-logo { width: 50px; }
  .header-right { width: 100%; }
  .search { width: 100%; }
  .gnmath-btn { width: 100%; justify-content: center; }
}
</style>
</head>
<body>

<canvas id="particles"></canvas>

<div id="intro">
  <img src="logo.png" alt="" class="intro-logo">
  <div class="intro-text" id="introText"></div>
  <div class="intro-sub">GAMES</div>
  <button class="intro-skip" id="introSkip">Skip →</button>
</div>

<button class="theme-toggle" id="themeToggle" title="Toggle theme">
  <svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
  <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
</button>

<header>
  <div class="header-left">
    <img src="logo.png" alt="Yumix" class="main-logo">
    <h1>Yumix <span>Games</span></h1>
  </div>
  <div class="header-right">
    <input type="text" id="search" class="search" placeholder="Search games..." autocomplete="off">
    <button class="gnmath-btn" id="gnmathBtn" title="Open GN Math">
      <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
      <span>GN Math</span>
    </button>
  </div>
</header>

<div class="count" id="count"></div>
<div id="gameGrid"></div>

<div class="game-overlay" id="gameOverlay">
  <iframe id="gameFrame" src="about:blank" allowfullscreen
    allow="autoplay; fullscreen; gamepad; clipboard-write; accelerometer; gyroscope"
    referrerpolicy="no-referrer"></iframe>
</div>

<div class="overlay-loading hidden" id="overlayLoading">
  <div class="spinner"></div>
  <p id="overlayLoadingText">Loading game...</p>
</div>

<div class="overlay-bar" id="overlayBar">
  <button class="obar-btn close" id="obarClose"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg><span>Close</span></button>
  <div class="obar-divider"></div>
  <span class="obar-title" id="obarTitle">Game</span>
  <div class="obar-divider"></div>
  <button class="obar-btn" id="obarReload"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><polyline points="21 3 21 9 15 9"/></svg><span>Reload</span></button>
  <button class="obar-btn" id="obarFullscreen"><svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg><span>Fullscreen</span></button>
  <button class="obar-btn" id="obarNewtab"><svg viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14L21 3"/></svg><span>New tab</span></button>
</div>

<div class="page-slide" id="pageSlide"></div>

<script>
/* THEME */
(function () {
  const saved = localStorage.getItem("theme");
  const prefersLight = window.matchMedia("(prefers-color-scheme: light)").matches;
  const theme = saved || (prefersLight ? "light" : "dark");
  document.documentElement.setAttribute("data-theme", theme);
})();
document.getElementById("themeToggle").addEventListener("click", () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const next = cur === "light" ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", next);
  localStorage.setItem("theme", next);
});

/* INTRO */
(function () {
  const text = "Welcome To Yumix Games";
  const container = document.getElementById("introText");
  const intro = document.getElementById("intro");
  const skip = document.getElementById("introSkip");
  let done = false;

  const chars = text.split("");
  chars.forEach((ch, i) => {
    const span = document.createElement("span");
    if (ch === " ") {
      span.className = "intro-letter space";
      span.innerHTML = "&nbsp;";
    } else {
      span.className = "intro-letter";
      span.textContent = ch;
    }
    const angle = Math.random() * Math.PI * 2;
    const dist = 500 + Math.random() * 700;
    const dx = Math.cos(angle) * dist;
    const dy = Math.sin(angle) * dist;
    const dr = (Math.random() - 0.5) * 360;
    span.style.setProperty("--dx", dx + "px");
    span.style.setProperty("--dy", dy + "px");
    span.style.setProperty("--dr", dr + "deg");
    span.style.setProperty("--delay", (0.4 + i * 0.045) + "s");
    container.appendChild(span);
  });

  const totalIntroTime = chars.length * 45 + 1400;

  function endIntro() {
    if (done) return;
    done = true;
    intro.classList.add("done");
    setTimeout(() => intro.remove(), 800);
  }
  setTimeout(endIntro, totalIntroTime);
  skip.addEventListener("click", endIntro);
  document.addEventListener("keydown", function (e) {
    if (!done && (e.key === "Escape" || e.key === "Enter" || e.key === " ")) endIntro();
  });
})();

/* PARTICLES */
(function () {
  const canvas = document.getElementById("particles");
  const ctx = canvas.getContext("2d");
  let w, h, dots = [];
  const COUNT = 60;

  function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }
  window.addEventListener("resize", resize);
  resize();

  function baseColor() {
    const isLight = document.documentElement.getAttribute("data-theme") === "light";
    return isLight ? "rgba(0,0,0," : "rgba(255,255,255,";
  }

  for (let i = 0; i < COUNT; i++) {
    dots.push({
      x: Math.random() * w,
      y: Math.random() * h,
      vx: (Math.random() - 0.5) * 0.35,
      vy: (Math.random() - 0.5) * 0.35,
      r: 1 + Math.random() * 1.8
    });
  }

  function tick() {
    ctx.clearRect(0, 0, w, h);
    const base = baseColor();
    for (let i = 0; i < dots.length; i++) {
      const d = dots[i];
      d.x += d.vx; d.y += d.vy;
      if (d.x < 0 || d.x > w) d.vx *= -1;
      if (d.y < 0 || d.y > h) d.vy *= -1;
      ctx.beginPath();
      ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
      ctx.fillStyle = base + "0.55)";
      ctx.fill();
      for (let j = i + 1; j < dots.length; j++) {
        const o = dots[j];
        const dx = d.x - o.x, dy = d.y - o.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 130) {
          ctx.beginPath();
          ctx.moveTo(d.x, d.y);
          ctx.lineTo(o.x, o.y);
          ctx.strokeStyle = base + (0.12 * (1 - dist / 130)) + ")";
          ctx.lineWidth = 1;
          ctx.stroke();
        }
      }
    }
    requestAnimationFrame(tick);
  }
  tick();
})();

/* PAGE SLIDE NAVIGATION */
(function () {
  const slide = document.getElementById("pageSlide");
  const btn = document.getElementById("gnmathBtn");

  // If we just navigated in from another page, slide the panel out to the left
  if (sessionStorage.getItem("slideFrom")) {
    sessionStorage.removeItem("slideFrom");
    slide.classList.add("enter");
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        slide.classList.add("leaving");
      });
    });
    setTimeout(() => {
      slide.classList.remove("enter", "leaving");
    }, 700);
  }

  btn.addEventListener("click", () => {
    slide.classList.add("active");
    sessionStorage.setItem("slideFrom", "true");
    setTimeout(() => {
      window.location.href = "gnmath.html";
    }, 620);
  });
})();
</script>

<script src="games.js"></script>
</body>
</html>
