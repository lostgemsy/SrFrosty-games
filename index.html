<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yumix Games</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Inter', system-ui, sans-serif;
  background: #050505;
  color: #f5f5f5;
  min-height: 100vh;
  padding: 32px 20px 80px;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

/* ============ HEADER ============ */
header {
  max-width: 1200px;
  margin: 0 auto 32px;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 20px;
  flex-wrap: wrap;
}

h1 {
  font-size: clamp(2rem, 5vw, 3rem);
  font-weight: 900;
  letter-spacing: -0.05em;
  color: #fff;
}

h1 span { color: #666; }

.search {
  width: min(360px, 100%);
  height: 48px;
  padding: 0 18px;
  border-radius: 12px;
  border: 1.5px solid rgba(255,255,255,.1);
  background: rgba(255,255,255,.04);
  color: #fff;
  font-family: inherit;
  font-size: 14px;
  outline: none;
  transition: border-color .2s ease;
}

.search:focus { border-color: rgba(255,255,255,.4); }
.search::placeholder { color: rgba(255,255,255,.35); }

/* ============ COUNT ============ */
.count {
  max-width: 1200px;
  margin: 0 auto 20px;
  font-size: 13px;
  font-weight: 600;
  color: rgba(255,255,255,.4);
}

/* ============ GRID ============ */
#gameGrid {
  max-width: 1200px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 20px;
}

.game-card {
  display: flex;
  flex-direction: column;
  padding: 10px;
  border-radius: 16px;
  background: rgba(255,255,255,.035);
  border: 1.5px solid rgba(255,255,255,.08);
  text-decoration: none;
  color: #fff;
  transition: all .25s ease;
  cursor: pointer;
}

.game-card:hover {
  border-color: rgba(255,255,255,.35);
  transform: translateY(-6px);
  box-shadow: 0 20px 45px rgba(0,0,0,.6);
}

.game-card img {
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;
  border-radius: 11px;
  background: #111;
  display: block;
}

.game-card h3 {
  margin: 12px 4px 4px;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: -0.015em;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.empty {
  grid-column: 1 / -1;
  padding: 60px 20px;
  text-align: center;
  color: rgba(255,255,255,.4);
  font-weight: 600;
}

/* ============ IFRAME OVERLAY ============ */
.game-overlay {
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: #000;
  opacity: 0;
  visibility: hidden;
  transition: opacity .3s ease, visibility .3s ease;
}

.game-overlay.active {
  opacity: 1;
  visibility: visible;
}

.game-overlay iframe {
  width: 100%;
  height: 100%;
  border: 0;
  background: #000;
  display: block;
}

/* Control bar */
.overlay-bar {
  position: fixed;
  top: 16px;
  left: 50%;
  transform: translateX(-50%) translateY(-80px);
  z-index: 10001;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 7px;
  background: rgba(0, 0, 0, 0.75);
  border: 1.5px solid rgba(255, 255, 255, 0.12);
  border-radius: 15px;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
  opacity: 0;
  transition: opacity .3s ease, transform .4s cubic-bezier(.2, .8, .2, 1);
}

.overlay-bar.visible {
  transform: translateX(-50%) translateY(0);
  opacity: 0.4;
}

.overlay-bar.visible:hover {
  opacity: 1;
  transform: translateX(-50%) translateY(-2px);
}

.obar-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  height: 38px;
  padding: 0 14px;
  border: 1.5px solid transparent;
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.06);
  color: #fff;
  font-family: inherit;
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
  transition: all .2s ease;
  white-space: nowrap;
}

.obar-btn:hover {
  background: rgba(255, 255, 255, 0.16);
  border-color: rgba(255, 255, 255, 0.25);
  transform: translateY(-2px);
}

.obar-btn:active { transform: translateY(0) scale(.96); }

.obar-btn.close:hover {
  background: #dc2626;
  border-color: #dc2626;
}

.obar-btn svg {
  width: 15px;
  height: 15px;
  stroke: currentColor;
  fill: none;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.obar-divider {
  width: 1px;
  height: 22px;
  background: rgba(255, 255, 255, 0.15);
  margin: 0 3px;
}

.obar-title {
  padding: 0 10px;
  color: #fff;
  font-size: 13px;
  font-weight: 700;
  max-width: 180px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* Loading spinner */
.overlay-loading {
  position: fixed;
  inset: 0;
  z-index: 10000;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  background: #050505;
  transition: opacity .4s ease, visibility .4s ease;
}

.overlay-loading.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.overlay-loading .spinner {
  width: 44px;
  height: 44px;
  border: 3px solid rgba(255,255,255,.15);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin .9s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

.overlay-loading p {
  color: rgba(255,255,255,.5);
  font-size: 13px;
  font-weight: 500;
}

/* ============ RESPONSIVE ============ */
@media (max-width: 600px) {
  body { padding: 20px 14px 60px; }
  #gameGrid {
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }
  .game-card { padding: 7px; border-radius: 12px; }
  .game-card h3 { font-size: 12px; }

  .overlay-bar { top: 10px; gap: 4px; padding: 5px; border-radius: 12px; }
  .obar-btn { height: 34px; padding: 0 10px; font-size: 11.5px; }
  .obar-btn span { display: none; }
  .obar-btn svg { width: 17px; height: 17px; }
  .obar-title, .obar-divider { display: none; }
}
</style>
</head>
<body>

<header>
  <h1>Yumix <span>Games</span></h1>
  <input
    type="text"
    id="search"
    class="search"
    placeholder="Search games..."
    autocomplete="off"
  >
</header>

<div class="count" id="count"></div>

<div id="gameGrid"></div>

<!-- IFRAME OVERLAY -->
<div class="game-overlay" id="gameOverlay">
  <iframe
    id="gameFrame"
    src="about:blank"
    allowfullscreen
    allow="autoplay; fullscreen; gamepad; clipboard-write; accelerometer; gyroscope"
    referrerpolicy="no-referrer"
  ></iframe>
</div>

<div class="overlay-loading hidden" id="overlayLoading">
  <div class="spinner"></div>
  <p id="overlayLoadingText">Loading game...</p>
</div>

<div class="overlay-bar" id="overlayBar">
  <button class="obar-btn close" id="obarClose" title="Close game">
    <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
    <span>Close</span>
  </button>
  <div class="obar-divider"></div>
  <span class="obar-title" id="obarTitle">Game</span>
  <div class="obar-divider"></div>
  <button class="obar-btn" id="obarReload" title="Reload game">
    <svg viewBox="0 0 24 24">
      <path d="M21 12a9 9 0 1 1-3-6.7"/>
      <polyline points="21 3 21 9 15 9"/>
    </svg>
    <span>Reload</span>
  </button>
  <button class="obar-btn" id="obarFullscreen" title="Fullscreen">
    <svg viewBox="0 0 24 24">
      <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
    </svg>
    <span>Fullscreen</span>
  </button>
  <button class="obar-btn" id="obarNewtab" title="Open in new tab">
    <svg viewBox="0 0 24 24">
      <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
      <path d="M15 3h6v6"/>
      <path d="M10 14L21 3"/>
    </svg>
    <span>New tab</span>
  </button>
</div>

<script src="games.js"></script>

</body>
</html>
