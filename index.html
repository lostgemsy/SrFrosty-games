<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Farius Games</title>
<meta name="description" content="Farius Games — play instantly, no downloads.">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22black%22/><text x=%2250%22 y=%2268%22 font-size=%2260%22 fill=%22white%22 text-anchor=%22middle%22 font-family=%22sans-serif%22>F</text></svg>">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a href="/" class="logo" aria-label="Farius Games home">
      <b><span class="char">F</span><span class="char">A</span><span class="char">R</span><span class="char">I</span><span class="char">U</span><span class="char">S</span></b>
      <span>GAMES</span>
    </a>
    <label class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="search-input" type="text" placeholder="Search games…" autocomplete="off">
    </label>
  </div>
</header>

<main class="wrap">
  <div id="poll-widget" class="poll" aria-live="polite"></div>

  <div class="section-title"><span id="game-count">0</span> games</div>
  <div id="gameGallery" class="grid"></div>
</main>

<footer>Farius Games</footer>

<!-- announcement overlay -->
<div id="announce-overlay" class="announce-overlay">
  <div class="announce-card">
    <div class="announce-eyebrow">Announcement</div>
    <div id="announce-text" class="announce-text"></div>
    <button id="announce-close" class="announce-close">Got it</button>
    <div class="announce-bar-track"><div id="announce-bar-fill" class="announce-bar-fill"></div></div>
  </div>
</div>

<script src="games.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
