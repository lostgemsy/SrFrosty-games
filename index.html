<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Farius Games</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    /* ============================================
       RESET & BASE
       ============================================ */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #050505;
      color: #f5f5f5;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      line-height: 1.5;
    }

    /* ============================================
       AMBIENT BACKGROUND
       ============================================ */
    .ambient {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .ambient::before {
      content: '';
      position: absolute;
      top: -30%;
      left: 50%;
      transform: translateX(-50%);
      width: 1000px;
      height: 1000px;
      background: radial-gradient(
        circle,
        rgba(255, 255, 255, 0.055) 0%,
        rgba(255, 255, 255, 0.015) 40%,
        transparent 70%
      );
      filter: blur(40px);
      animation: ambientDrift 20s ease-in-out infinite;
    }

    .ambient::after {
      content: '';
      position: absolute;
      bottom: -25%;
      right: -15%;
      width: 800px;
      height: 800px;
      background: radial-gradient(
        circle,
        rgba(255, 255, 255, 0.03) 0%,
        transparent 65%
      );
      filter: blur(40px);
      animation: ambientDrift 25s ease-in-out infinite reverse;
    }

    @keyframes ambientDrift {
      0%, 100% { transform: translate(-50%, 0) scale(1); }
      50% { transform: translate(-45%, 30px) scale(1.08); }
    }

    .noise {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      opacity: 0.028;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    /* ============================================
       TOPBAR
       ============================================ */
    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 40px;
      background: rgba(5, 5, 5, 0.72);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(24px) saturate(140%);
      -webkit-backdrop-filter: blur(24px) saturate(140%);
      animation: topbarIn 0.6s cubic-bezier(.2, .8, .2, 1) both;
    }

    @keyframes topbarIn {
      from { opacity: 0; transform: translateY(-24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .brand {
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 0.02em;
      color: rgba(255, 255, 255, 0.6);
      text-decoration: none;
      transition: color 0.25s ease;
    }

    .brand span {
      color: #fff;
      margin-left: 2px;
    }

    .brand:hover {
      color: #fff;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-actions a,
    .nav-actions button {
      padding: 9px 18px;
      border-radius: 11px;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: rgba(255, 255, 255, 0.65);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.22s cubic-bezier(.2, .8, .2, 1);
      letter-spacing: -0.005em;
    }

    .nav-actions a:hover,
    .nav-actions button:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.2);
      color: #fff;
      transform: translateY(-1px);
    }

    .nav-actions button:active {
      transform: scale(0.97);
    }

    /* ============================================
       MAIN
       ============================================ */
    main {
      position: relative;
      z-index: 2;
      max-width: 1320px;
      margin: 0 auto;
      padding: 0 40px 100px;
    }

    /* ============================================
       HERO
       ============================================ */
    .hero {
      position: relative;
      min-height: 78vh;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 40px;
      padding: 140px 0 80px;
    }

    .hero-copy {
      flex: 1;
      max-width: 620px;
      animation: heroCopyIn 0.9s 0.1s cubic-bezier(.2, .8, .2, 1) both;
    }

    @keyframes heroCopyIn {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 10.5px;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.4);
      margin-bottom: 22px;
    }

    .eyebrow::before {
      content: '';
      width: 20px;
      height: 1px;
      background: rgba(255, 255, 255, 0.3);
    }

    .hero h1 {
      font-size: clamp(2.8rem, 7.5vw, 5.8rem);
      font-weight: 900;
      letter-spacing: -0.06em;
      line-height: 0.98;
      color: #fff;
      margin-bottom: 26px;
    }

    .hero h1 em {
      font-style: normal;
      background: linear-gradient(180deg, #fff 0%, #666 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .hero .sub {
      font-size: 15.5px;
      color: rgba(255, 255, 255, 0.5);
      font-weight: 500;
      line-height: 1.7;
      max-width: 500px;
      margin-bottom: 36px;
    }

    .hero .sub code {
      padding: 2px 8px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.07);
      color: #fff;
      font-family: "SF Mono", "Fira Code", monospace;
      font-size: 13px;
      font-weight: 600;
    }

    .hero-stats {
      display: inline-flex;
      align-items: baseline;
      gap: 12px;
      padding: 14px 22px;
      border-radius: 15px;
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      animation: heroStatsIn 0.9s 0.25s cubic-bezier(.2, .8, .2, 1) both;
    }

    @keyframes heroStatsIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .hero-stats strong {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: -0.05em;
      color: #fff;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }

    .hero-stats span {
      font-size: 12px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.4);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .hero-mark {
      flex: none;
      font-size: clamp(220px, 26vw, 420px);
      font-weight: 900;
      line-height: 0.85;
      letter-spacing: -0.09em;
      color: transparent;
      -webkit-text-stroke: 1.5px rgba(255, 255, 255, 0.06);
      user-select: none;
      pointer-events: none;
      animation: heroMarkIn 1.1s 0.15s cubic-bezier(.2, .8, .2, 1) both;
    }

    @keyframes heroMarkIn {
      from { opacity: 0; transform: scale(0.85) rotate(-4deg); }
      to { opacity: 1; transform: scale(1) rotate(0); }
    }

    /* ============================================
       ANNOUNCEMENT SLOT
       ============================================ */
    .announcement-slot {
      margin: 20px 0 60px;
      animation: fadeUp 0.6s ease both;
    }

    .announcement-slot[hidden] {
      display: none;
    }

    /* ============================================
       TOOLBAR
       ============================================ */
    .toolbar {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      padding-top: 40px;
      margin-bottom: 22px;
      flex-wrap: wrap;
      animation: fadeUp 0.7s 0.35s cubic-bezier(.2, .8, .2, 1) both;
    }

    .toolbar h2 {
      font-size: clamp(1.8rem, 3.5vw, 2.6rem);
      font-weight: 900;
      letter-spacing: -0.045em;
      color: #fff;
      line-height: 1.05;
      margin-top: 6px;
    }

    .search {
      display: flex;
      align-items: center;
      gap: 10px;
      width: min(420px, 100%);
      height: 52px;
      padding: 0 18px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.04);
      border: 1.5px solid rgba(255, 255, 255, 0.1);
      transition: all 0.25s ease;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03);
    }

    .search span {
      font-size: 18px;
      color: rgba(255, 255, 255, 0.35);
      flex: none;
      line-height: 1;
    }

    .search:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .search:focus-within {
      background: rgba(255, 255, 255, 0.07);
      border-color: rgba(255, 255, 255, 0.5);
      box-shadow:
        0 0 0 4px rgba(255, 255, 255, 0.06),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }

    .search input {
      flex: 1;
      min-width: 0;
      height: 100%;
      background: transparent;
      border: 0;
      outline: 0;
      color: #fff;
      font-family: inherit;
      font-size: 14.5px;
      font-weight: 500;
      padding: 0;
    }

    .search input::placeholder {
      color: rgba(255, 255, 255, 0.3);
      font-weight: 400;
    }

    /* ============================================
       FILTER LINE
       ============================================ */
    .filter-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 28px;
      padding-bottom: 18px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      animation: fadeUp 0.7s 0.4s cubic-bezier(.2, .8, .2, 1) both;
    }

    .filter-line span {
      font-size: 13px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.4);
      letter-spacing: 0.02em;
    }

    .filter-line button {
      padding: 8px 16px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .filter-line button:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-1px);
    }

    /* ============================================
       GAME GRID
       ============================================ */
    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 22px;
      margin-bottom: 60px;
      animation: fadeUp 0.7s 0.45s cubic-bezier(.2, .8, .2, 1) both;
    }

    /* Fallback card styling in case games.js / app.js add plain cards.
       These styles apply to any direct children of #gameGrid. */
    .game-grid > a,
    .game-grid > .game-card,
    .game-grid > .card,
    .game-grid article {
      position: relative;
      display: flex;
      flex-direction: column;
      padding: 10px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.035);
      border: 1.5px solid rgba(255, 255, 255, 0.08);
      color: #fff;
      text-decoration: none;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(.2, .8, .2, 1);
      animation: cardIn 0.5s ease both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .game-grid > a::before,
    .game-grid > .game-card::before,
    .game-grid > .card::before,
    .game-grid article::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.08), transparent 60%);
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .game-grid > a:hover,
    .game-grid > .game-card:hover,
    .game-grid > .card:hover,
    .game-grid article:hover {
      border-color: rgba(255, 255, 255, 0.35);
      transform: translateY(-8px) scale(1.02);
      box-shadow:
        0 24px 50px rgba(0, 0, 0, 0.6),
        0 0 30px rgba(255, 255, 255, 0.045);
    }

    .game-grid > a:hover::before,
    .game-grid > .game-card:hover::before,
    .game-grid > .card:hover::before,
    .game-grid article:hover::before {
      opacity: 1;
    }

    .game-grid img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 12px;
      background: #111;
      display: block;
      transition: transform 0.5s cubic-bezier(.2, .8, .2, 1), filter 0.3s ease;
    }

    .game-grid > a:hover img,
    .game-grid > .game-card:hover img,
    .game-grid > .card:hover img,
    .game-grid article:hover img {
      transform: scale(1.08);
      filter: brightness(1.08);
    }

    .game-grid h3,
    .game-grid .game-title,
    .game-grid .title {
      margin: 12px 4px 4px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.015em;
      color: #fff;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ============================================
       POLL MODAL
       ============================================ */
    .poll {
      position: fixed;
      inset: 0;
      z-index: 9000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      animation: pollFadeIn 0.3s ease both;
    }

    .poll[hidden] {
      display: none;
    }

    @keyframes pollFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .poll-card {
      width: 100%;
      max-width: 480px;
      padding: 36px 32px;
      border-radius: 24px;
      background: linear-gradient(
        160deg,
        rgba(20, 20, 22, 0.95),
        rgba(10, 10, 12, 0.98)
      );
      border: 1.5px solid rgba(255, 255, 255, 0.1);
      box-shadow:
        0 40px 100px rgba(0, 0, 0, 0.6),
        inset 0 1px 0 rgba(255, 255, 255, 0.06);
      position: relative;
      animation: pollCardIn 0.4s cubic-bezier(.2, .8, .2, 1) both;
    }

    @keyframes pollCardIn {
      from { opacity: 0; transform: translateY(20px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .poll-card .x {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.04);
      color: rgba(255, 255, 255, 0.6);
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .poll-card .x:hover {
      background: rgba(220, 38, 38, 0.2);
      border-color: rgba(220, 38, 38, 0.6);
      color: #fff;
    }

    .poll-card h2 {
      font-size: 1.45rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: #fff;
      line-height: 1.3;
      margin-bottom: 24px;
      padding-right: 40px;
    }

    .poll-card #pollOptions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }

    .poll-card .poll-result {
      min-height: 20px;
      font-size: 13px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.5);
      text-align: center;
      margin-top: 4px;
    }

    /* ============================================
       FOOTER
       ============================================ */
    footer {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 40px 20px 60px;
      color: rgba(255, 255, 255, 0.28);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    footer span {
      color: rgba(255, 255, 255, 0.15);
      margin: 0 8px;
    }

    /* ============================================
       RESPONSIVE
       ============================================ */
    @media (max-width: 900px) {
      .topbar { padding: 14px 20px; }
      main { padding: 0 20px 80px; }
      .hero { padding: 120px 0 60px; min-height: auto; }
      .hero-mark { display: none; }
      .game-grid {
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 16px;
      }
    }

    @media (max-width: 600px) {
      .topbar { padding: 12px 14px; }
      .brand { font-size: 14px; }
      .nav-actions a, .nav-actions button {
        padding: 8px 12px;
        font-size: 12px;
      }
      main { padding: 0 14px 60px; }
      .hero { padding: 110px 0 40px; }
      .hero h1 { margin-bottom: 20px; }
      .hero .sub { font-size: 14px; }
      .hero-stats strong { font-size: 26px; }
      .toolbar { padding-top: 20px; }
      .search { height: 48px; width: 100%; }
      .game-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }
      .game-grid > a,
      .game-grid > .game-card,
      .game-grid > .card,
      .game-grid article {
        padding: 7px;
        border-radius: 14px;
      }
      .game-grid h3,
      .game-grid .game-title,
      .game-grid .title {
        font-size: 12px;
        margin: 8px 2px 2px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="ambient"></div>
  <div class="noise"></div>

  <header class="topbar">
    <a class="brand" href="/">FARIUS<span>GAMES</span></a>
    <div class="nav-actions">
      <a href="#games">Games</a>
      <button id="randomBtn">Random</button>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="hero-copy">
        <p class="eyebrow">THE ARCADE / 01</p>
        <h1>Play without<br><em>the noise.</em></h1>
        <p class="sub">
          A clean monochrome library for your games. Pick a game and Farius
          loads its real files directly from <code>/games</code>.
        </p>
        <div class="hero-stats">
          <strong id="gameCount">0</strong>
          <span>games indexed</span>
        </div>
      </div>
      <div class="hero-mark" aria-hidden="true">F</div>
    </section>

    <section class="announcement-slot" id="announcementSlot" hidden></section>

    <section class="toolbar" id="games">
      <div>
        <p class="eyebrow">LIBRARY</p>
        <h2>All games</h2>
      </div>
      <label class="search">
        <span>⌕</span>
        <input id="search" placeholder="Search games..." autocomplete="off">
      </label>
    </section>

    <div class="filter-line">
      <span id="resultCount">Loading catalog...</span>
      <button id="clearSearch" hidden>Clear</button>
    </div>

    <section class="game-grid" id="gameGrid" aria-live="polite"></section>
  </main>

  <div class="poll" id="poll" hidden>
    <div class="poll-card">
      <button class="x" id="closePoll">×</button>
      <p class="eyebrow">FARIUS POLL</p>
      <h2 id="pollQuestion"></h2>
      <div id="pollOptions"></div>
      <p class="poll-result" id="pollResult"></p>
    </div>
  </div>

  <footer>
    FARIUS GAMES <span>•</span> ROOT /GAMES + /IMAGES
  </footer>

  <script src="games.js"></script>
  <script src="app.js"></script>
</body>
</html>
